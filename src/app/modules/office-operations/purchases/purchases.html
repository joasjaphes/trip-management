<app-layout [title]="title()" [description]="description()" [addText]="'Create Order'" (add)="onAdd()"
  [(viewDetails)]="viewDetails" [formTitle]="formTitle()" [formDescription]="formDescription()" [splitSize]="splitSize()">
  <ng-container ngProjectAs="main">
    <div class="purchase-summary-grid mb-4">
      <div class="summary-card">
        <p class="summary-label">Total Orders</p>
        <p class="summary-value">{{ totalOrders() }}</p>
      </div>
      <div class="summary-card">
        <p class="summary-label">Total Value</p>
        <p class="summary-value">{{ totalOrderAmount() | number }}</p>
      </div>
    </div>

    <!-- Status Tabs -->
    <div class="status-tabs mb-4" role="tablist" aria-label="Purchase order status tabs">
      @for (tab of statusTabs(); track tab.key) {
      <button type="button" class="status-tab" [class.status-tab-active]="selectedStatus() === tab.key"
        role="tab" [attr.aria-selected]="selectedStatus() === tab.key" (click)="selectedStatus.set(tab.key)">
        <span>{{ tab.label }}</span>
        <span class="status-count">{{ tab.count }}</span>
      </button>
      }
    </div>

    <!-- Advanced Filters -->
    <div class="filters-panel mb-4">
      <div class="filter-row">
        <!-- Vendor Filter -->
        <div class="filter-item">
          <label class="text-[11px] font-extrabold tracking-widest text-gray-400 uppercase mb-2">Vendor</label>
          <div class="relative">
            <select [ngModel]="filterVendorId()" (ngModelChange)="filterVendorId.set($event)"
              class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2.5 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors appearance-none cursor-pointer">
              <option value="">All Vendors</option>
              @for (vendor of vendorOptions(); track vendor.id) {
              <option [value]="vendor.id">{{ vendor.vendorName }}</option>
              }
            </select>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
              class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-300 pointer-events-none">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </div>
        </div>

        <!-- From Date Filter -->
        <div class="filter-item">
          <label class="text-[11px] font-extrabold tracking-widest text-gray-400 uppercase mb-2">From Date</label>
          <input type="date" [ngModel]="filterFromDate()" (ngModelChange)="filterFromDate.set($event)"
            class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2.5 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300" />
        </div>

        <!-- To Date Filter -->
        <div class="filter-item">
          <label class="text-[11px] font-extrabold tracking-widest text-gray-400 uppercase mb-2">To Date</label>
          <input type="date" [ngModel]="filterToDate()" (ngModelChange)="filterToDate.set($event)"
            class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2.5 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300" />
        </div>

        <!-- Reset Filters Button -->
        <div class="filter-item flex items-end">
          <button type="button" (click)="filterVendorId.set(''); filterFromDate.set(''); filterToDate.set('')"
            class="w-full border border-gray-200 bg-white hover:bg-gray-50 text-gray-700 hover:text-[#f25f2f] hover:border-[#f8b9a2] rounded-lg px-3 py-2.5 text-[13px] font-bold transition-colors">
            Reset Filters
          </button>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <app-data-table [data]="filteredRows()" [config]="tableConfigurations" [loading]="loading()"
      [moreActions]="moreActions()"></app-data-table>
  </ng-container>

  <ng-container ngProjectAs="form">
    @if (viewType() === 'add' || viewType() === 'edit') {
    <app-purchase-order-form [purchaseOrder]="selectedPurchaseOrder()" [vendors]="vendorService.allVendors()"
      [expenses]="expenseCategoryService.allCategories()" (close)="onCloseForm()"></app-purchase-order-form>
    }
  </ng-container>
</app-layout>
