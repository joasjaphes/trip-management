<app-layout [title]="title()" [description]="description()" [addText]="addText()" (add)="onAdd()" [(viewDetails)]="viewDetails" [formTitle]="formTitle()" [formDescription]="formDescription()" [splitSize]="splitSize()">
  <ng-container ngProjectAs="main">
    <app-data-table [data]="roles()" [config]="tableConfigurations" [loading]="loading()" (edit)="onEdit($event)" [permissions]="permissions()"></app-data-table>
  </ng-container>

  <ng-container ngProjectAs="form">
    @if (viewType == 'add' || viewType == 'edit') {
      <app-role-form [role]="currentRole()" (close)="onCloseForm($event)"></app-role-form>
    }
  </ng-container>
</app-layout>
