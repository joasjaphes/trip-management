<div class="w-full h-full overflow-y-auto bg-[#f3f4f6] text-gray-800">
  <div class="bg-white border border-gray-100 rounded-2xl p-8 relative overflow-hidden shadow-sm">
    <div class="flex items-center gap-3 mb-6">
      <i class="fa-solid fa-location-dot text-[#f25f2f]"></i>
      <h3 class="text-[16px] font-extrabold text-gray-900 tracking-wide">
        Update Trip Actual Position
        @if (trip()?.tripReferenceNumber) {
        <span class="text-gray-400">({{ trip()!.tripReferenceNumber }})</span>
        }
      </h3>
    </div>

    @if (actionMessage()) {
    <div class="mb-4 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-[13px] font-semibold text-blue-700">
      {{ actionMessage() }}
    </div>
    }

    @if (successMessage()) {
    <div class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-[13px] font-semibold text-emerald-700">
      {{ successMessage() }}
    </div>
    }

    @if (error()) {
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] font-semibold text-red-700">
      {{ error() }}
    </div>
    }

    <div class="mb-6">
      <label class="text-[13px] font-bold text-gray-700 block mb-2">Current Position</label>
      <textarea [(ngModel)]="actualPosition" name="actualPosition" rows="4"
        placeholder="Example: Lat: -6.7, Lng: 39.2 or Dar es Salaam, Ubungo"
        class="w-full bg-white border border-gray-200 rounded-lg px-3 py-2.5 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300"></textarea>
      <p class="text-[11px] text-gray-400 mt-2">You can enter coordinates or any readable location description.</p>
    </div>

    <app-save-area [saveText]="'Update Position'" [loading]="loading()" [disabled]="!hasChanges()"
      (cancel)="goBack()" (save)="onSubmit()"></app-save-area>
  </div>
</div>
