<div class="w-full max-w-2xl rounded-2xl bg-white p-6 text-gray-800 shadow-xl">
  <div class="mb-6 flex items-start justify-between gap-4">
    <div>
      <h2 class="text-[22px] font-extrabold text-gray-900">{{ data.title }}</h2>
      <p class="mt-1 text-[13px] font-medium text-gray-500">{{ data.description }}</p>
    </div>
    <button type="button" (click)="close()" class="rounded-full px-3 py-1 text-[12px] font-bold text-gray-400 hover:text-gray-700">
      Close
    </button>
  </div>

  @if (errorMessage()) {
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] font-semibold text-red-700">
      {{ errorMessage() }}
    </div>
  }

  @if (successMessage()) {
    <div class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-[13px] font-semibold text-emerald-700">
      {{ successMessage() }}
    </div>
  }

  <div class="grid gap-5">
    <div>
      <label class="mb-2 block text-[13px] font-bold text-gray-700">Vendor name</label>
      <input type="text" [(ngModel)]="vendorName" name="vendorName" placeholder="e.g. Fuel Station Ltd"
        class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-[14px] text-gray-800 placeholder-gray-300 transition-colors focus:border-[#f25f2f] focus:outline-none">
    </div>

    <div>
      <label class="mb-2 block text-[13px] font-bold text-gray-700">TIN</label>
      <input type="text" [(ngModel)]="vendorTIN" name="vendorTIN" placeholder="e.g. TIN-123456789"
        class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-[14px] text-gray-800 placeholder-gray-300 transition-colors focus:border-[#f25f2f] focus:outline-none">
    </div>

    <div>
      <label class="mb-2 block text-[13px] font-bold text-gray-700">Contact number</label>
      <input type="text" [(ngModel)]="vendorContact" name="vendorContact" placeholder="e.g. +255700000000"
        class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-[14px] text-gray-800 placeholder-gray-300 transition-colors focus:border-[#f25f2f] focus:outline-none">
    </div>

    <div>
      <label class="mb-2 block text-[13px] font-bold text-gray-700">Address</label>
      <textarea [(ngModel)]="vendorAddress" name="vendorAddress" rows="3" placeholder="e.g. Dar es Salaam, Tanzania"
        class="w-full rounded-lg border border-gray-200 bg-white px-4 py-3 text-[14px] text-gray-800 placeholder-gray-300 transition-colors focus:border-[#f25f2f] focus:outline-none"></textarea>
    </div>
  </div>

  <div class="mt-6 flex items-center justify-end gap-3">
    <button type="button" (click)="close()"
      class="rounded-lg border border-gray-200 bg-white px-5 py-2.5 text-[13px] font-bold text-gray-700 transition-colors hover:bg-gray-50">
      Cancel
    </button>
    <button type="button" (click)="onSubmit()" [disabled]="saving()"
      class="rounded-lg border-none bg-[#f25f2f] px-5 py-2.5 text-[13px] font-bold text-white shadow-[0_4px_12px_rgba(240,43,60,0.25)] transition-colors hover:bg-[#ff5117] disabled:cursor-not-allowed disabled:opacity-50">
      @if (saving()) {
        Saving...
      } @else {
        Save vendor
      }
    </button>
  </div>
</div>
