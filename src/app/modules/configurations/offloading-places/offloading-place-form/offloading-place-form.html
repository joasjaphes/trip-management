<div class="w-full h-full overflow-y-auto bg-[#f3f4f6] text-gray-800">
  <div class="max-w-[800px] mx-auto">
    @if (actionMessage()) {
    <div
      class="mb-4 rounded-xl border border-blue-200 bg-blue-50 px-4 py-3 text-[13px] font-semibold text-blue-700 flex items-center gap-2">
      <span class="loading loading-spinner loading-sm"></span>
      <span>{{ actionMessage() }}</span>
    </div>
    }

    @if (successMessage()) {
    <div
      class="mb-4 rounded-xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-[13px] font-semibold text-emerald-700">
      {{ successMessage() }}
    </div>
    }

    @if (errorMessage()) {
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-[13px] font-semibold text-red-700">
      {{ errorMessage() }}
    </div>
    }

    <div class="bg-white border border-gray-100 rounded-2xl p-8 shadow-sm mb-6">
      <div class="mb-6">
        <label class="text-[13px] font-bold text-gray-700 block mb-2">Offloading place name</label>
        <input
          type="text"
          placeholder="e.g. Dar es Salaam Port"
          [(ngModel)]="name"
          name="name"
          class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300"
        >
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="text-[13px] font-bold text-gray-700 block mb-2">Latitude (optional)</label>
          <input
            type="text"
            placeholder="e.g. -6.819"
            [(ngModel)]="latitude"
            name="latitude"
            class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300"
          >
        </div>

        <div>
          <label class="text-[13px] font-bold text-gray-700 block mb-2">Longitude (optional)</label>
          <input
            type="text"
            placeholder="e.g. 39.289"
            [(ngModel)]="longitude"
            name="longitude"
            class="w-full bg-white border border-gray-200 rounded-lg px-4 py-3 text-[14px] text-gray-800 focus:outline-none focus:border-[#f25f2f] transition-colors placeholder-gray-300"
          >
        </div>
      </div>
    </div>

    <app-save-area
      [saveText]="editMode() ? 'Update offloading place' : 'Save offloading place'"
      [loading]="saving()"
      (cancel)="goBack()"
      (save)="onSubmit()"
    ></app-save-area>
  </div>
</div>
